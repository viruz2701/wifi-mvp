name: Test and Build

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: wifi_user
          POSTGRES_PASSWORD: wifi_pass
          POSTGRES_DB: wifi_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: wifi_user
          POSTGRES_PASSWORD: wifi_pass
          POSTGRES_DB: wifi_auth_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SECRET_KEY: testsecret
          ENCRYPTION_KEY: dummyencryptionkeydummyencryptionkey12=
        run: |
          cd backend
          pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: yourusername/wifi-backend:latest
      - name: Build and push netflow-listener
        uses: docker/build-push-action@v5
        with:
          context: ./netflow-listener
          push: true
          tags: yourusername/wifi-netflow:latest
      - name: Build and push telegram_bot
        uses: docker/build-push-action@v5
        with:
          context: ./telegram_bot
          push: true
          tags: yourusername/wifi-telegram-bot:latest