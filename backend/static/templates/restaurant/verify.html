<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение - $(venue_name)</title>
    <link rel="stylesheet" href="/static/templates/restaurant/style.css">
</head>
<body>
    <div class="hero" style="min-height: auto;">
        <div class="overlay"></div>
        <div class="content">
            <h1>$(venue_name)</h1>
            <p class="tagline">Введите код из SMS</p>
            
            $(if error_text)
            <div class="error">$(error_text)</div>
            $(endif)
            
            <div class="auth-box">
                <form method="post" action="/portal/$(venue_id)/verify">
                    <input type="hidden" name="phone" value="$(phone)">
                    <input type="hidden" name="mac" value="$(mac)">
                    <div class="input-group">
                        <input type="text" name="code" placeholder="Код из SMS" required>
                    </div>
                    <button type="submit">Подтвердить</button>
                </form>
                <p style="margin-top: 15px;">Код отправлен на номер $(phone)</p>
            </div>
        </div>
    </div>
</body>
</html>
