<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добро пожаловать - $(venue_name)</title>
    <link rel="stylesheet" href="/static/templates/restaurant/style.css">
</head>
<body>
    <div class="hero" style="min-height: auto;">
        <div class="overlay"></div>
        <div class="content">
            <h1>$(venue_name)</h1>
            <p class="tagline">Вы успешно авторизованы!</p>
            <div class="auth-box">
                <p>Приятного аппетита и быстрого интернета!</p>
                <p>Ваш MAC: $(mac)</p>
                <img src="$(banner_url)" alt="Спасибо" style="max-width: 100%; border-radius: 10px;">
            </div>
        </div>
    </div>
</body>
</html>
