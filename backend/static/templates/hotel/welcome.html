<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добро пожаловать - $(venue_name)</title>
    <link rel="stylesheet" href="/static/templates/hotel/style.css">
</head>
<body>
    <div class="header">
        <div class="hotel-name">$(venue_name)</div>
    </div>
    <div class="container">
        <div class="welcome-card">
            <h1>Вы успешно авторизованы!</h1>
            <p class="subtitle">Приятного отдыха в нашем отеле</p>
            <p>MAC адрес: $(mac)</p>
        </div>
    </div>
    <div class="footer">
        <img src="$(banner_url)" alt="Партнеры" class="partners">
    </div>
</body>
</html>
