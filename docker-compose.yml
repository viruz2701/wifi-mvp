version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: wifi_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wifi_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wifi_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /etc/wireguard:/etc/wireguard:rw   # для управления WireGuard на хосте
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    cap_add:
      - NET_ADMIN                  # необходимо для команд wg
    devices:
      - /dev/net/tun:/dev/net/tun  # доступ к TUN устройству

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wifi_celery
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.tasks worker --loglevel=info

  netflow_listener:
    build:
      context: ./netflow-listener
      dockerfile: Dockerfile
    container_name: wifi_netflow
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "20002:20002/udp"
    volumes:
      - ./netflow-listener:/app

  nginx:
    image: nginx:alpine
    container_name: wifi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/build:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  timescaledb_data:
  redis_data: