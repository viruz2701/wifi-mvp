version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: wifi_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wifi_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wifi_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /etc/wireguard:/etc/wireguard:rw
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wifi_celery
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.tasks worker --loglevel=info

  netflow_listener:
    build:
      context: ./netflow-listener
      dockerfile: Dockerfile
    container_name: wifi_netflow
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "20002:20002/udp"
    volumes:
      - ./netflow-listener:/app

  nginx:
    image: nginx:alpine
    container_name: wifi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/build:/usr/share/nginx/html
      - ./backend/static:/usr/share/nginx/html/static
      - ./docs:/usr/share/nginx/html/docs   # <-- добавляем эту строку
    depends_on:
      - backend

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wifi_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.tasks beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  prometheus:
    image: prom/prometheus:latest
    container_name: wifi_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: wifi_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3030:3000"

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: wifi_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "9187:9187"

  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: wifi_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"

  backup:
    image: postgres:15-alpine
    container_name: wifi_backup
    restart: unless-stopped
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh
    entrypoint: |
      sh -c "
      echo '0 2 * * * /backup.sh >> /var/log/cron.log 2>&1' > /etc/crontabs/root
      crond -f
      "
    depends_on:
      - timescaledb

  telegram_bot:
    build:
      context: ./telegram_bot
      dockerfile: Dockerfile
    container_name: wifi_telegram_bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis
      - backend
    ports:
      - "8080:8080"
    volumes:
      - ./telegram_bot:/app
    networks:
      - default

volumes:
  timescaledb_data:
  redis_data:
  prometheus_data:
  grafana_data: